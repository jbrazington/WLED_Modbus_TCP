name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: make -C test

  firmware:
    runs-on: ubuntu-latest
    needs: test
    env:
      WLED_TAG: v16.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch WLED
        run: git clone --depth 1 -b "$WLED_TAG" https://github.com/wled/WLED.git WLED
      - name: Add usermod
        run: |
          cp -r usermods/Modbus_TCP WLED/usermods/
          cp platformio_override.ini WLED/
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.WLED_TAG }}
      - name: Build
        working-directory: WLED
        run: |
          pip install -r requirements.txt
          npm ci
          pio run -e esp32_eth_modbus -e esp32dev_modbus
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: WLED/build_output/release/*.bin
