; Drop this file in the root of a WLED v16.0.1 checkout, next to platformio.ini,
; and copy usermods/Modbus_TCP into the checkout's usermods/ folder.
[platformio]
default_envs = esp32dev_modbus

[env:esp32dev_modbus]
extends = env:esp32dev
custom_usermods = Modbus_TCP   ; add "audioreactive" here to keep audio reactive effects

; Ethernet build (EternaGlo Plus: select Ethernet type WT32-ETH01 in WLED)
[env:esp32_eth_modbus]
extends = env:esp32_eth
custom_usermods = Modbus_TCP
